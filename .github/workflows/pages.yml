name: Build and deploy site

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        type: boolean
        default: true
        description: 'Commit IGDB covers into project repos'

permissions:
  actions: write # keepalive below
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node scripts/build.mjs
        env:
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          COMMIT_COVERS: ${{ (github.event_name != 'workflow_dispatch' || inputs.commit) && 'true' || 'false' }}
      # GitHub disables scheduled workflows after 60 days without repo activity; re-enabling resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/pages.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
      # Pages caches each file for 10 min; versioned URLs stop a new page loading an old script.
      - name: Cache-bust assets
        run: |
          v=${GITHUB_SHA::7}
          sed -i "s/style\.css\"/style.css?v=$v\"/; s/app\.js\"/app.js?v=$v\"/" site/index.html
          sed -i "s#'./view.js'#'./view.js?v=$v'#" site/app.js
          grep -q "app.js?v=$v" site/index.html && grep -q "view.js?v=$v" site/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
