<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTL · Minh-Nhat Ton-That Localization</title>
  <meta name="description" content="English fan translations of Japanese retro games">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topline"></div>
  <header class="nav">
    <a class="logo" href="./">MTL<small>Minh-Nhat Ton-That Localization</small></a>
    <nav class="links-top">
      <a href="#games">Games</a>
      <a href="https://github.com/minhnhattonthat" target="_blank" rel="noopener">GitHub</a>
      <a class="kofi" href="https://ko-fi.com/minhnhattonthat" target="_blank" rel="noopener">Ko-fi</a>
    </nav>
  </header>

  <section class="hero" id="hero" aria-label="Featured"></section>
  <nav class="strip" id="strip" aria-label="Latest projects"></nav>

  <main class="wrap" id="games">
    <div class="head"><h2>GAMES</h2><span>タイトル一覧</span></div>

    <div class="toolbar">
      <div class="pills" id="platform" role="group" aria-label="Platform">
        <button type="button" value="" aria-pressed="true">All</button>
        <button type="button" value="SNES" aria-pressed="false">SNES</button>
        <button type="button" value="GBA" aria-pressed="false">GBA</button>
        <button type="button" value="NDS" aria-pressed="false">NDS</button>
        <button type="button" value="PS1" aria-pressed="false">PS1</button>
        <button type="button" value="PSP" aria-pressed="false">PSP</button>
        <button type="button" value="Other" aria-pressed="false">Other</button>
      </div>
  
      <form class="controls" onsubmit="return false">
          <input type="search" id="q" placeholder="Search title…" aria-label="Search">
          <select id="sort" aria-label="Sort">
            <option value="az">A–Z</option>
            <option value="release">Latest release</option>
            <option value="created">Newest project</option>
          </select>
      </form>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
  </main>

  <footer class="bottom">
    <p>English fan translations of Japanese retro games. Enjoying them?</p>
    <a class="kofi-btn" href="https://ko-fi.com/minhnhattonthat" target="_blank" rel="noopener"><img src="https://ko-fi.com/img/githubbutton_sm.svg" alt="Support me on Ko-fi" height="30"></a>
    <p class="small">MTL · Minh-Nhat Ton-That Localization. Games and cover art belong to their owners.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
